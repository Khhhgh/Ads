<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعلان المكافأة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
        }
        .box {
            padding: 20px;
            border-radius: 12px;
            background: #1e1e1e;
            max-width: 90vw;
        }
        .err { color: #ff6b6b; }
        .ok { color: #6bff9e; }
    </style>
</head>
<body>
    <div class="box">
        <h3 id="title">جاري تجهيز الإعلان... ⏳</h3>
        <p>شاهد الفيديو كاملاً لتحصل على التنزيلات الإضافية.</p>
    </div>

    <script>
        // ================== الإعدادات ==================
        const DEFAULT_REWARD_ENDPOINT = location.origin + "/webapp/reward";

        const params = new URLSearchParams(window.location.search);
        const REWARD_ENDPOINT = (params.get("reward") || DEFAULT_REWARD_ENDPOINT).trim();

        if (params.has("reward")) {
            try {
                history.replaceState(null, "", location.pathname + location.hash);
            } catch (e) { /* ignore */ }
        }

        const tg = window.Telegram?.WebApp;
        const titleEl = document.getElementById("title");

        function fail(msg) {
            titleEl.classList.add("err");
            titleEl.textContent = msg;
        }

        if (!tg) {
            fail("افتح هذه الصفحة من داخل تيليجرام.");
            throw new Error("Telegram WebApp unavailable");
        }

        tg.ready();
        tg.expand();

        const initData = tg.initData || "";
        if (!initData) {
            if (typeof tg.sendData === "function") {
                tg.sendData("reward_granted");
                tg.close();
                throw new Error("reply-keyboard fallback used");
            }
            fail("لم يتم العثور على بيانات جلسة تيليجرام. افتح الإعلان من البوت.");
            throw new Error("No initData");
        }

        // ==========================================================================
        //  متغيّرات حالة دقيقة للتمييز بين الحالات الثلاث:
        //   1) مكافأة   : شاهد الإعلان كاملاً        -> status=reward
        //   2) تعويض    : لم يتوفر إعلان من الأساس    -> status=noads  (يمنح 4)
        //   3) إلغاء    : ظهر الإعلان ثم أغلقه المستخدم -> لا شيء ولا مكافأة
        //
        //  قاعدة الأمان: لا نمنح التعويض إلا إذا تأكدنا أنه لم يبدأ عرض أي
        //  إعلان إطلاقاً. أي إشارة إلى ظهور الإعلان (onStart / onSkip /
        //  onReward / onComplete) تقتل مسار التعويض نهائياً.
        // ==========================================================================
        let finished = false;   // تم إرسال طلب نهائي (مكافأة/تعويض) أو إغلاق مقصود
        let adStarted = false;  // ظهر أول إطار من الإعلان فعلياً على الشاشة
        let adResolved = false; // حسم الإعلان (مكافأة/تخطٍ/خطأ) دون حاجة لمهلة

        function markAborted() {
            // ظهر الإعلان أو انتهى بأي شكل: لا تعويض بعد الآن.
            adStarted = true;
            adResolved = true;
        }

        // status: "reward" | "noads"
        async function reportReward(status) {
            if (finished) return;
            finished = true;

            if (!REWARD_ENDPOINT) {
                fail("لم يتم ضبط رابط سيرفر البوت (reward endpoint).");
                return;
            }
            try {
                const body = new URLSearchParams();
                body.set("initData", initData);
                body.set("status", status === "noads" ? "noads" : "reward");
                // ننتظر رد السيرفر قبل الإغلاق حتى لا تُغلق النافذة والطلب لم يصل.
                const res = await fetch(REWARD_ENDPOINT, {
                    method: "POST",
                    body: body,
                    keepalive: true,
                });
                try { await res.text(); } catch (e) { /* ignore */ }
                if (!res.ok) {
                    console.warn("reward endpoint returned", res.status);
                }
            } catch (e) {
                console.warn("reward post failed", e);
            } finally {
                tg.close();
            }
        }

        function abortWithoutReward() {
            // المستخدم أغلق الإعلان قبل نهايته: لا تعويض ولا مكافأة، وإبلاغه بالإلغاء.
            if (finished) return;
            finished = true;
            titleEl.classList.remove("err");
            titleEl.classList.add("ok");
            titleEl.textContent = "لم يكتمل الإعلان، تم إلغاء العملية. حاول مرة أخرى.";
            // مهلة قصيرة ليرى الرسالة ثم تُغلق النافذة.
            setTimeout(() => { try { tg.close(); } catch (e) {} }, 1200);
        }

        // التحقق من تحميل مكتبة Adsgram (في حال تم حظر السكريبت أو فشل الاتصال)
        let AdController = null;
        try {
            if (window.Adsgram) {
                AdController = window.Adsgram.init({ blockId: "53002" });
            }
        } catch (err) {
            console.error("Adsgram init error:", err);
        }

        // الحالة الوحيدة المسموح فيها بالتعويض دون تشغيل: تعذّر تهيئة الإعلانات
        // تماماً (السكريبت محظور/لم يُحمّل). لم يظهر أي إعلان إطلاقاً.
        if (!AdController) {
            reportReward("noads");
        } else {
            // (1) أول إطار ظهر على الشاشة => الإعلان بدأ فعلاً، ممنوع التعويض بعده.
            AdController.addEventListener('onStart', () => {
                adStarted = true;
            });

            // (2) المستخدم أغلق الإعلان => إلغاء بلا مكافأة.
            AdController.addEventListener('onSkip', () => {
                markAborted();
                abortWithoutReward();
            });

            // (3) شاهد الإعلان حتى النهاية => مكافأة.
            AdController.addEventListener('onReward', () => {
                markAborted();
                reportReward("reward");
            });

            // (4) إعلان بيني (interstitial) انتهى أو أُغلق => لا مكافأة.
            //     لمكافأة الفيديو نعتمد على onReward/show-ال resolve.
            AdController.addEventListener('onComplete', () => {
                markAborted();
                abortWithoutReward();
            });

            // (5) خطأ أثناء العرض أو التشغيل: إذا لم يبدأ الإعلان إطلاقاً فهذا
            //     فشل جلب => تعويض. أما إذا كان قد بدأ فعلاً فالخطأ وقع أثناء
            //     التشغيل (المستخدم أغلقه) => لا تعويض.
            AdController.addEventListener('onError', () => {
                adResolved = true;
                if (!adStarted) {
                    reportReward("noads");
                } else {
                    abortWithoutReward();
                }
            });

            // (6) لا يوجد إعلان لعرضه (No Fill) => الحالة الشرعية الوحيدة للتعويض.
            AdController.addEventListener('onBannerNotFound', () => {
                adResolved = true;
                if (!adStarted) {
                    reportReward("noads");
                } else {
                    abortWithoutReward();
                }
            });

            // (7) منع عرض إعلانات متتالية / جلسة طويلة => لا إعلان متاح الآن
            //     (لم يبدأ أي إعلان) => تعويض.
            AdController.addEventListener('onNonStopShow', () => {
                adResolved = true;
                if (!adStarted) {
                    reportReward("noads");
                } else {
                    abortWithoutReward();
                }
            });
            AdController.addEventListener('onTooLongSession', () => {
                adResolved = true;
                if (!adStarted) {
                    reportReward("noads");
                } else {
                    abortWithoutReward();
                }
            });

            // (8) طلب تشغيل الإعلان.
            AdController.show()
                .then(() => {
                    // حُسم الإعلان بنجاح: شوهد حتى النهاية.
                    adResolved = true;
                    markAborted();
                    reportReward("reward");
                })
                .catch((result) => {
                    // حُسم الإعلان (فشل أو تخطٍ).
                    adResolved = true;

                    // القرار الحاسم: هل ظهر إعلان فعلاً؟
                    //   - ظهر (أي إشارة onStart / state=playing|destroy) => إلغاء.
                    //   - لم يظهر، والفشل في مرحلة التحميل (error=true & state=load
                    //     أو state=render أو error=true) => تعويض.
                    const state = result && result.state;
                    const isError = !!(result && result.error === true);
                    const wasPlaying =
                        adStarted ||
                        state === 'playing' ||
                        state === 'destroy';

                    if (wasPlaying) {
                        // الإعلان ظهر ثم أغلقه المستخدم/تخطاه => لا تعويض.
                        abortWithoutReward();
                        return;
                    }

                    // لم يظهر أي إعلان:
                    //  - خطأ تحميل صريح، أو فشل قبل العرض => تعويض.
                    //  - التخطي دون بدء (error=false) نادر جداً؛ نمنح تعويضاً فقط
                    //    إذا كان الخطأ صريحاً في مرحلة التحميل/العرض.
                    const loadFailure =
                        isError && (state === 'load' || state === 'render' || !state);

                    if (loadFailure) {
                        reportReward("noads");
                    } else {
                        // تخطٍ أو رفض غير معروف دون أي إشارة عرض => لا تعويض
                        // (نمنع أي ربح غير مستحق لعدم اكتمال أي إعلان).
                        abortWithoutReward();
                    }
                });
        }

        // ==========================================================================
        //  مهلة احتياطية آمنة:
        //  تُطلق التعويض فقط إذا لم تظهر أي إشارة إطلاقاً (لا بدء، ولا حسم).
        //  لذلك لا يمكن أن تُمنح المكافأة أثناء إعلان قيد التشغيل، لأن onStart
        //  يضبط adStarted ويمنع المهلة. المدة 12 ثانية (زمن تحميل معقول).
        // ==========================================================================
        setTimeout(() => {
            if (finished || adResolved || adStarted) return;
            console.log("Fallback timeout: no ad ever started, granting grace");
            reportReward("noads");
        }, 12000);
    </script>
</body>
</html>
