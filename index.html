<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعلان المكافأة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
        }
        .box {
            padding: 20px;
            border-radius: 12px;
            background: #1e1e1e;
        }
    </style>
</head>
<body>
    <div class="box">
        <h3>جاري تجهيز الإعلان... ⏳</h3>
        <p>شاهد الفيديو كاملاً لتحصل على التنزيلات الإضافية.</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const AdController = window.Adsgram.init({ blockId: "50203" });

        AdController.show().then((result) => {
            tg.sendData("reward_granted");
        }).catch((result) => {
            tg.close();
        });
    </script>
</body>
</html>
