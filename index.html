<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعلان المكافأة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
        }
        .box {
            padding: 20px;
            border-radius: 12px;
            background: #1e1e1e;
            max-width: 90vw;
        }
        .err { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="box">
        <h3 id="title">جاري تجهيز الإعلان... ⏳</h3>
        <p>شاهد الفيديو كاملاً لتحصل على التنزيلات الإضافية.</p>
    </div>

    <script>
        // ================== الإعدادات ==================
        const DEFAULT_REWARD_ENDPOINT = location.origin + "/webapp/reward";

        const params = new URLSearchParams(window.location.search);
        const REWARD_ENDPOINT = (params.get("reward") || DEFAULT_REWARD_ENDPOINT).trim();

        if (params.has("reward")) {
            try {
                history.replaceState(null, "", location.pathname + location.hash);
            } catch (e) { /* ignore */ }
        }

        const tg = window.Telegram?.WebApp;
        const titleEl = document.getElementById("title");

        function fail(msg) {
            titleEl.classList.add("err");
            titleEl.textContent = msg;
        }

        if (!tg) {
            fail("افتح هذه الصفحة من داخل تيليجرام.");
            throw new Error("Telegram WebApp unavailable");
        }

        tg.ready();
        tg.expand();

        const initData = tg.initData || "";
        if (!initData) {
            if (typeof tg.sendData === "function") {
                tg.sendData("reward_granted");
                tg.close();
                throw new Error("reply-keyboard fallback used");
            }
            fail("لم يتم العثور على بيانات جلسة تيليجرام. افتح الإعلان من البوت.");
            throw new Error("No initData");
        }

        // متغيرات للتحكم الدقيق في منح الرصيد
        let rewardReported = false; // حماية ضد التكرار
        let adStarted = false;      // يتحول إلى true فقط إذا بدأ عرض الإعلان فعلياً للمستخدم

        async function reportReward() {
            if (rewardReported) return;
            rewardReported = true;

            if (!REWARD_ENDPOINT) {
                fail("لم يتم ضبط رابط سيرفر البوت (reward endpoint).");
                return;
            }
            try {
                const body = new URLSearchParams();
                body.set("initData", initData);
                // ننتظر رد السيرفر بالكامل قبل الإغلاق، حتى لا تُغلق النافذة
                // والطلب لم يصل/لم يُعالج بعد.
                const res = await fetch(REWARD_ENDPOINT, {
                    method: "POST",
                    body: body,
                    keepalive: true,
                });
                // تفريغ جسم الرد يضمن تسليم الطلب كاملاً للسيرفر.
                try { await res.text(); } catch (e) { /* ignore */ }
                if (!res.ok) {
                    console.warn("reward endpoint returned", res.status);
                }
            } catch (e) {
                console.warn("reward post failed", e);
            } finally {
                tg.close();
            }
        }

        // التحقق من تحميل مكتبة Adsgram (في حال تم حظر السكريبت أو فشل الاتصال)
        let AdController = null;
        try {
            if (window.Adsgram) {
                AdController = window.Adsgram.init({ blockId: "53002" });
            }
        } catch (err) {
            console.error("Adsgram init error:", err);
        }

        // إذا تعذر جلب السكريبت أو تهيئة الإعلانات تماماً -> منح الرصيد وإغلاق الصفحة فوراً
        if (!AdController) {
            reportReward();
        } else {
            // 1. حدث بدء تشغيل الإعلان فعلياً على شاشة المستخدم
            AdController.addEventListener('onStart', () => {
                adStarted = true;
            });

            // 2. حدث عدم توفر إعلان متاح في السيرفر (No Fill / Banner Not Found)
            AdController.addEventListener('onBannerNotFound', () => {
                reportReward(); // منح الرصيد تعويضاً للمستخدم
            });

            // 3. حدث وقوع خطأ تقني في الجلب
            AdController.addEventListener('onError', (err) => {
                if (!adStarted) {
                    reportReward(); // منح الرصيد إذا حدث الخطأ قبل بدء الإعلان
                }
            });

            // 4. طلب تشغيل الإعلان
            AdController.show()
                .then(() => {
                    // شاهد المستخدم الإعلان كاملاً بنجاح
                    reportReward();
                })
                .catch((result) => {
                    // التمييز الدقيق بين فشل الإعلان وبين تخطي المستخدم له
                    const isFailure = !adStarted || 
                                      result?.error === true || 
                                      result?.state === 'load' || 
                                      result?.state === 'render';

                    if (isFailure) {
                        // فشل الإعلان في التحميل أو لم يظهر أساساً -> منحه الرصيد تعويضاً
                        reportReward();
                    } else {
                        // الإعلان ظهر واشتغل، لكن المستخدم تعمد إغلاقه أو تخطيه -> إغلاق بدون رصيد
                        tg.close();
                    }
                });
        }
    </script>
</body>
</html>
